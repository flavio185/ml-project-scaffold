name: Test Azure OIDC Connection

on:
  # Allows you to manually click "Run workflow" from GitHub UI
  workflow_dispatch: 
  # Fires on push to verify branch-matching behavior
  push:
    branches:
      - '**' 

permissions:
  id-token: write # Vital: This requests the OIDC JWT token from GitHub
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check Account Context
        run: |
          echo "Successfully authenticated via Flexible FIC!"
          az account show --output table
